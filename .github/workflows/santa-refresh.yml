name: Santa daily submission

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: Asia/Tokyo
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: santa-refresh
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Kaggle CLI
        run: python -m pip install 'kaggle==2.2.5' six
      - name: Restore the last successful snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow santa-refresh.yml --branch "$GITHUB_REF_NAME" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$previous" ]; then
            gh run download "$previous" --repo "$GITHUB_REPOSITORY" --name santa-state --dir out/santa-sync
            gh run download "$previous" --repo "$GITHUB_REPOSITORY" --name santa-discussion --dir out/santa-discussion
          fi
      - name: Discover and validate public candidates
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          kaggle competitions download santa-2026 -f puzzles.csv -p data
          make discover-all
          if [ ! -f out/santa-sync/discovered-references.json ]; then
            printf '{}\n' > out/santa-sync/discovered-references.json
          fi
      - name: Pass the discovery state to the merge job
        uses: actions/upload-artifact@v4
        with:
          name: santa-discovery-state
          path: |
            out/santa-sync/submission.csv
            out/santa-sync/discovered-references.json
            out/santa-sync/hashes.json
          if-no-files-found: error
      - name: Save Discussion candidates
        uses: actions/upload-artifact@v4
        with:
          name: santa-discussion
          path: out/santa-discussion/candidates.json
          if-no-files-found: error

  inspect-github:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: santa-discussion
          path: out/santa-discussion
      - name: Check Codex credentials
        id: credentials
        env:
          CODEX_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$CODEX_KEY" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo '::warning::OPENAI_API_KEY is missing; skipping the Codex restoration review.'
          fi
      - name: Install Codex CLI
        if: steps.credentials.outputs.available == 'true'
        run: npm install --global @openai/codex@0.171.0-alpha.13
      - name: Inspect restoration steps with Codex
        id: review
        if: steps.credentials.outputs.available == 'true'
        continue-on-error: true
        env:
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: make review-restore
      - name: Report an unavailable Codex review
        if: steps.review.outcome == 'failure'
        run: echo '::warning::Codex review failed. The verified portfolio will still be submitted.'
      - name: Save the Codex report
        if: steps.review.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: santa-restore-review
          path: out/restore-review.json
          if-no-files-found: error

  submit:
    needs: [discover, inspect-github]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: santa-discovery-state
          path: out/santa-sync
      - name: Prepare Kaggle CLI and competition inputs
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python -m pip install 'kaggle==2.2.5' six
          kaggle competitions download santa-2026 -p out/competition
          unzip -j out/competition/santa-2026.zip puzzles.csv sample_submission.csv -d data
      - name: Restore, merge, verify, and submit once to Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: make merge-and-submit
      - name: Save the verified portfolio for the next run
        uses: actions/upload-artifact@v4
        with:
          name: santa-state
          path: |
            out/santa-sync/submission.csv
            out/santa-sync/discovered-references.json
            out/santa-sync/hashes.json
            out/santa-sync/scores.json
          if-no-files-found: error
